[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-intel-transcriber"
version = "0.1.0"
description = "MVP de transcripcion en tiempo real para reuniones comerciales."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.97.0",
    "python-dotenv>=1.0.1",
    "sounddevice>=0.4.7",
    "numpy>=2.0.0",
    "faster-whisper>=1.1.1",
]

[project.scripts]
sales-transcriber = "sales_transcriber.main:main"
sales-audio-check = "sales_transcriber.audio.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]
